version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - uploads:/tmp/uploads
      - output:/tmp/output
    environment:
      - PORT=3000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

volumes:
  uploads:
  output:
